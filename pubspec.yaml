name: stockly_saas
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase & Backend
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.0

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Génération de code (Annotations)
  freezed_annotation: ^2.4.1

  # UI, Design & Graphiques
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # Impression, Exportation & Partage
  pdf: ^3.13.0
  printing: ^5.15.0
  excel: ^4.0.0
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^10.0.0

  # Réseau, Utilitaires & Scanner
  http: ^1.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  mobile_scanner: ^6.0.0
  connectivity_plus: ^6.0.5
  file_picker: ^8.0.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  archive: ^3.6.1
  xml: ^7.0.1
  firebase_ai: ^2.3.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Outils de génération de code requis
  build_runner: ^2.4.8
  freezed: ^2.4.7

# Force la compatibilité entre les paquets excel et pdf
dependency_overrides:
  xml: ^7.0.1

flutter:
  uses-material-design: true
  # Génère automatiquement le code des traductions (fichiers lib/l10n/*.arb)
  generate: true