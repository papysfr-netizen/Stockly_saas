# 🏭 Fabrication automatique de l'APK Nguli
#
# À chaque envoi sur GitHub (git push) qui touche l'application :
#   1. les tests (calculs de caisse + règles de sécurité Firestore) sont lancés ;
#   2. si tout est vert, l'APK est fabriqué et signé avec la clé officielle ;
#   3. il est publié dans « Releases » du dépôt, sous le nom de la branche,
#      prêt à être téléchargé sur le téléphone.
#
# On peut aussi le lancer à la main : onglet « Actions » → « APK Nguli » → « Run workflow ».
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   NGULI_KEYSTORE_BASE64   le fichier de clé .jks, encodé en base64
#   NGULI_KEYSTORE_PASSWORD le mot de passe du fichier de clé
#   NGULI_KEY_ALIAS         le nom de la clé (ex : nguli)
#   NGULI_KEY_PASSWORD      le mot de passe de la clé
# Sans ces secrets, l'APK est quand même fabriqué, mais signé avec une clé de
# test différente à chaque fois (il faudra désinstaller avant d'installer).

name: APK Nguli

on:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firestore.rules'
      - 'tests_regles/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version FIXE : la même à chaque fabrication (pas de surprise)
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Tests de l'application (calculs de caisse, devises…)
        run: |
          flutter pub get
          flutter test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests des règles de sécurité Firestore
        working-directory: tests_regles
        run: |
          npm ci
          npm test

  apk:
    name: Fabrication de l'APK
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Version FIXE : la même à chaque fabrication (pas de surprise)
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Installer la clé de signature officielle
        env:
          KEYSTORE_BASE64: ${{ secrets.NGULI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NGULI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NGULI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NGULI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Pas de clé officielle dans les secrets : APK signé avec une clé de test."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/nguli-upload.jks
          # Les mots de passe ne sont PAS écrits dans le fichier : Gradle les lit
          # directement dans l'environnement (étape suivante).
          echo "storeFile=nguli-upload.jks" > android/key.properties

          # Vérification immédiate et claire du mot de passe
          if ! keytool -list -keystore android/app/nguli-upload.jks \
                 -storepass:env KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Le secret NGULI_KEYSTORE_PASSWORD ne correspond pas à la clé. Recréez-le (sans espace avant ou après)."
            exit 1
          fi
          if ! keytool -list -keystore android/app/nguli-upload.jks \
                 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Le secret NGULI_KEY_ALIAS ne correspond pas (il doit valoir : nguli)."
            exit 1
          fi
          echo "Clé officielle et mot de passe vérifiés."

      - name: Fabriquer l'APK
        env:
          NGULI_KEYSTORE_PASSWORD: ${{ secrets.NGULI_KEYSTORE_PASSWORD }}
          NGULI_KEY_ALIAS: ${{ secrets.NGULI_KEY_ALIAS }}
          NGULI_KEY_PASSWORD: ${{ secrets.NGULI_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk universel.apk
          flutter build apk --release --split-per-abi

      - name: Publier l'APK dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          BRANCHE=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          TAG="apk-${BRANCHE}"
          NOM="nguli-${VERSION}-${BRANCHE}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$NOM"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "ancien-telephone-$NOM"
          cp universel.apk "universel-$NOM"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$NOM" "ancien-telephone-$NOM" "universel-$NOM" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Nguli ${VERSION} (${GITHUB_REF_NAME})" \
            --notes "APK fabriqué automatiquement depuis la branche ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}).
          Téléchargez **${NOM}** (presque tous les téléphones). « ancien-telephone » : très vieux téléphones. « universel » : tous les téléphones (plus gros)."

      - name: Garder une copie (30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: nguli-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
