name: ecole_app
description: "Gestion d'école : élèves, classes, frais de scolarité, notes, bulletins, présences et enseignants."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.0
  cloud_functions: ^5.1.0
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  pdf: ^3.11.0
  printing: ^5.13.0
  url_launcher: ^6.3.0
  excel: ^4.0.6
  share_plus: ^10.0.0
  path_provider: ^2.1.2
  web: ^1.0.0
  # Base en mémoire pour la démonstration (lib/main_demo.dart)
  fake_cloud_firestore: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Copie locale corrigée (voir third_party/fake_cloud_firestore/MODIFICATIONS.md)
dependency_overrides:
  fake_cloud_firestore:
    path: third_party/fake_cloud_firestore

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
  # Police embarquée : l'application n'a pas besoin de télécharger de police.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
