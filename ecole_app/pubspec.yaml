name: ecole_app
description: "Gestion d'école : élèves, classes, frais de scolarité, notes, bulletins, présences et enseignants."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.0
  cloud_functions: ^5.1.0
  flutter_riverpod: ^2.5.1
  intl: ^0.20.2
  pdf: ^3.11.0
  printing: ^5.13.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
