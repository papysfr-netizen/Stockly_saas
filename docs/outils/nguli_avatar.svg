<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a5b"/><stop offset="1" stop-color="#0f4d3a"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#8a5534"/><stop offset="1" stop-color="#5e3620"/>
    </radialGradient>
    <pattern id="pagne" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#f2b632"/>
      <circle cx="22" cy="22" r="11" fill="#e2572b"/>
      <circle cx="22" cy="22" r="5" fill="#f2b632"/>
      <circle cx="0" cy="0" r="6" fill="#1f8a5b"/><circle cx="44" cy="0" r="6" fill="#1f8a5b"/>
      <circle cx="0" cy="44" r="6" fill="#1f8a5b"/><circle cx="44" cy="44" r="6" fill="#1f8a5b"/>
    </pattern>
    <pattern id="robe" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1e5fbf"/>
      <circle cx="20" cy="20" r="8" fill="#f29d38"/><circle cx="20" cy="20" r="3.5" fill="#1e5fbf"/>
    </pattern>
    <clipPath id="rond"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#rond)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- collines du Kivu -->
    <path d="M0 390 Q130 320 260 370 T512 350 V512 H0Z" fill="#17734c" opacity=".8"/>
    <!-- épaules / robe -->
    <path d="M86 512 Q96 392 256 382 Q416 392 426 512Z" fill="url(#robe)"/>
    <path d="M196 386 Q256 430 316 386 L300 380 Q256 410 212 380Z" fill="#f2b632"/>
    <!-- cou -->
    <path d="M222 330 h68 v62 q-34 22 -68 0z" fill="#5e3620"/>
    <!-- visage -->
    <ellipse cx="256" cy="262" rx="92" ry="104" fill="url(#skin)"/>
    <!-- oreilles + boucles -->
    <ellipse cx="166" cy="272" rx="15" ry="22" fill="#6b3f25"/>
    <ellipse cx="346" cy="272" rx="15" ry="22" fill="#6b3f25"/>
    <circle cx="164" cy="306" r="10" fill="#f2b632"/><circle cx="348" cy="306" r="10" fill="#f2b632"/>
    <!-- foulard (pagne) -->
    <path d="M150 232 Q140 110 256 98 Q372 110 362 232 Q330 190 256 188 Q182 190 150 232Z" fill="url(#pagne)"/>
    <path d="M232 104 Q256 40 300 70 Q330 92 300 120 Q280 96 256 108Z" fill="url(#pagne)"/>
    <path d="M150 232 Q182 190 256 188 Q330 190 362 232" fill="none" stroke="#c2401c" stroke-width="7"/>
    <!-- sourcils -->
    <path d="M196 236 q22 -14 44 -2" stroke="#2b160b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M272 234 q22 -12 44 2" stroke="#2b160b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- yeux -->
    <ellipse cx="218" cy="262" rx="14" ry="16" fill="#fff"/><ellipse cx="294" cy="262" rx="14" ry="16" fill="#fff"/>
    <circle cx="220" cy="264" r="9" fill="#2b160b"/><circle cx="296" cy="264" r="9" fill="#2b160b"/>
    <circle cx="223" cy="260" r="3" fill="#fff"/><circle cx="299" cy="260" r="3" fill="#fff"/>
    <!-- nez -->
    <path d="M246 280 q10 22 -2 30 q12 6 24 0 q-12 -8 -2 -30" fill="#4e2c19" opacity=".6"/>
    <!-- joues -->
    <circle cx="196" cy="304" r="15" fill="#c0603e" opacity=".35"/><circle cx="316" cy="304" r="15" fill="#c0603e" opacity=".35"/>
    <!-- sourire -->
    <path d="M216 318 Q256 356 296 318 Q256 336 216 318Z" fill="#fff" stroke="#7a2a1a" stroke-width="5" stroke-linejoin="round"/>
    <!-- étincelle IA -->
    <g transform="translate(412 108)">
      <circle r="58" fill="#ffffff" opacity=".18"/>
      <path d="M0 -44 Q8 -8 44 0 Q8 8 0 44 Q-8 8 -44 0 Q-8 -8 0 -44Z" fill="#ffd54a"/>
      <path d="M40 -40 Q43 -30 52 -28 Q43 -25 40 -16 Q37 -25 28 -28 Q37 -30 40 -40Z" fill="#fff"/>
    </g>
  </g>
</svg>
